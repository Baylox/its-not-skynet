<svg width="900" height="268" viewBox="0 0 900 268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline de contribution : décrire, scaffolder, tester, vérifier, ouvrir une PR — statut draft, beta, stable">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect x="1.5" y="1.5" width="897" height="265" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <text x="450" y="36" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="bold" fill="#e6edf3">De l'idée à la ressource validée</text>

  <!-- étapes -->
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="24" y="56" width="140" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="94" y="88" font-size="24">💬</text>
    <text x="94" y="113" font-size="13.5" font-weight="bold" fill="#e6edf3">Décrire</text>
    <text x="94" y="130" font-size="11" fill="#8b949e">expliquez le besoin</text>
    <text x="94" y="144" font-size="11" fill="#8b949e">à votre agent</text>

    <rect x="202" y="56" width="140" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="272" y="88" font-size="24">🧱</text>
    <text x="272" y="113" font-size="13.5" font-weight="bold" fill="#e6edf3">Scaffolder</text>
    <text x="272" y="130" font-size="10.5" fill="#79c0ff" font-family="'SFMono-Regular',Consolas,Menlo,monospace">scripts/new.sh</text>
    <text x="272" y="144" font-size="11" fill="#8b949e">META.md · draft</text>

    <rect x="380" y="56" width="140" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="450" y="88" font-size="24">🧪</text>
    <text x="450" y="113" font-size="13.5" font-weight="bold" fill="#e6edf3">Tester</text>
    <text x="450" y="130" font-size="11" fill="#8b949e">en conditions</text>
    <text x="450" y="144" font-size="11" fill="#8b949e">réelles</text>

    <rect x="558" y="56" width="140" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="628" y="88" font-size="24">🩺</text>
    <text x="628" y="113" font-size="13.5" font-weight="bold" fill="#e6edf3">Vérifier</text>
    <text x="628" y="130" font-size="10.5" fill="#79c0ff" font-family="'SFMono-Regular',Consolas,Menlo,monospace">scripts/doctor.sh</text>
    <text x="628" y="144" font-size="10.5" fill="#8b949e">lint · catalogue · audit</text>

    <rect x="736" y="56" width="140" height="96" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="806" y="88" font-size="24">🚀</text>
    <text x="806" y="113" font-size="13.5" font-weight="bold" fill="#e6edf3">Ouvrir la PR</text>
    <text x="806" y="130" font-size="11" fill="#8b949e">la CI rejoue</text>
    <text x="806" y="144" font-size="11" fill="#8b949e">tous les checks</text>
  </g>

  <!-- flèches -->
  <g stroke="#58a6ff" stroke-width="1.8" opacity="0.85">
    <line x1="168" y1="104" x2="196" y2="104" marker-end="url(#arrow)"/>
    <line x1="346" y1="104" x2="374" y2="104" marker-end="url(#arrow)"/>
    <line x1="524" y1="104" x2="552" y2="104" marker-end="url(#arrow)"/>
    <line x1="702" y1="104" x2="730" y2="104" marker-end="url(#arrow)"/>
  </g>

  <!-- cycle de vie du statut -->
  <text x="450" y="188" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b949e">Statut META.md</text>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" text-anchor="middle">
    <rect x="246" y="200" width="96" height="26" rx="13" fill="#161b22" stroke="#6e7681"/>
    <text x="294" y="217" fill="#9198a1">draft</text>
    <rect x="402" y="200" width="96" height="26" rx="13" fill="#161b22" stroke="#d29922"/>
    <text x="450" y="217" fill="#d29922">beta</text>
    <rect x="558" y="200" width="96" height="26" rx="13" fill="#161b22" stroke="#3fb950"/>
    <text x="606" y="217" fill="#3fb950">stable</text>
  </g>
  <g stroke="#6e7681" stroke-width="1.6">
    <line x1="348" y1="213" x2="396" y2="213" marker-end="url(#arrow-dim)"/>
    <line x1="504" y1="213" x2="552" y2="213" marker-end="url(#arrow-dim)"/>
  </g>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e" text-anchor="middle">
    <text x="294" y="247">généré, jamais exécuté</text>
    <text x="450" y="247">testé, usage limité</text>
    <text x="606" y="247">éprouvé au quotidien</text>
  </g>
</svg>
