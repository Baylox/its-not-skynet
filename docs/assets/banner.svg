<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="its-not-skynet — validated CLI/AI resources">
  <defs>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- terminal card -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="2.5" y="2.5" width="895" height="33" rx="12" fill="#161b22"/>
  <rect x="2.5" y="22" width="895" height="14" fill="#161b22"/>
  <line x1="2" y1="36.5" x2="898" y2="36.5" stroke="#30363d" stroke-width="1"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="23.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#8b949e">contributor@github: ~/its-not-skynet</text>

  <!-- prompt lines -->
  <text x="38" y="68" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#7ee787">$</tspan><tspan fill="#c9d1d9" dx="8">./scripts/validate.sh --quiet</tspan>
  </text>
  <text x="38" y="90" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <tspan fill="#3fb950">✔</tspan><tspan fill="#8b949e" dx="8">every resource created or validated by its author</tspan>
  </text>

  <!-- big title + cursor -->
  <text x="36" y="146" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="46" font-weight="bold" fill="url(#title-grad)">its-not-skynet</text>
  <rect x="432" y="112" width="15" height="40" rx="2" fill="#58a6ff" opacity="0.85"/>

  <!-- tagline -->
  <text x="38" y="177" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1">No magic. No uncontrolled network. Just tools that work.</text>

  <!-- type pills -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12">
    <rect x="38" y="196" width="58" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="67" y="212" text-anchor="middle" fill="#7ee787">hooks</text>
    <rect x="106" y="196" width="65" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="138.5" y="212" text-anchor="middle" fill="#58a6ff">skills</text>
    <rect x="181" y="196" width="72" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="217" y="212" text-anchor="middle" fill="#d2a8ff">configs</text>
    <rect x="263" y="196" width="87" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="306.5" y="212" text-anchor="middle" fill="#ffa657">subagents</text>
    <rect x="360" y="196" width="108" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="414" y="212" text-anchor="middle" fill="#f778ba">architecture</text>
  </g>

  <!-- friendly robot, definitely not skynet -->
  <g transform="translate(720,58)">
    <line x1="60" y1="6" x2="60" y2="-8" stroke="#58a6ff" stroke-width="2.5"/>
    <circle cx="60" cy="-12" r="5" fill="#58a6ff"/>
    <rect x="10" y="6" width="100" height="78" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="32" y="32" width="16" height="16" rx="5" fill="#7ee787"/>
    <rect x="72" y="32" width="16" height="16" rx="5" fill="#7ee787"/>
    <rect x="44" y="60" width="32" height="6" rx="3" fill="#30363d"/>
    <circle cx="108" cy="82" r="15" fill="#238636" stroke="#0d1117" stroke-width="3"/>
    <path d="M101 82 l5 5 l11 -11" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="118" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8b949e">human-validated</text>
  </g>
</svg>
