<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Construit par des devs qui testent ce qu'ils partagent.">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M10 0V50M20 0V50M30 0V50M40 0V50M0 10H50M0 20H50M0 30H50M0 40H50" stroke="#152E4A" stroke-width="0.5" opacity="0.45"/>
      <path d="M0 0.5H50M0.5 0V50" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <style>
    text{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .fade{animation:fadeUp .55s ease-out both}
    .pop{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
    .xr{animation:blink 4.5s ease-in-out infinite}
    .x2{animation-delay:1.5s}.x3{animation-delay:3s}
    .d02{animation-delay:.2s}.d05{animation-delay:.5s}.d07{animation-delay:.7s}
    .d09{animation-delay:.9s}.d11{animation-delay:1.1s}.d13{animation-delay:1.3s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
    @keyframes pop{from{opacity:0;transform:scale(0)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect x="1" y="1" width="898" height="118" rx="10" fill="#0A1B2E" stroke="#1E3B58"/>
  <rect x="2" y="2" width="896" height="116" rx="9" fill="url(#grid)"/>
  <rect x="14" y="14" width="872" height="92" stroke="#2E5A80"/>
  <g class="fade d02" stroke="#9BE3FF" stroke-width="2">
    <path d="M14 28V14H28"/><path d="M872 14H886V28"/>
    <path d="M886 92V106H872"/><path d="M28 106H14V92"/>
  </g>
  <g stroke="#6FB7DF" stroke-width="1">
    <path class="xr" d="M30 60h10M35 55v10"/>
    <path class="xr x3" d="M860 60h10M865 55v10"/>
  </g>

  <text class="fade d02" x="450" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#DCEBF5">Construit par des devs qui testent ce qu'ils partagent.</text>

  <g class="fade d05">
    <path d="M190 61v14M710 61v14" stroke="#FFB65C" stroke-width="1"/>
    <line x1="200" y1="68" x2="700" y2="68" stroke="#FFB65C" stroke-width="1"/>
    <path d="M190 68l10-3.5v7z" fill="#FFB65C"/>
    <path d="M710 68l-10-3.5v7z" fill="#FFB65C"/>
  </g>

  <g transform="translate(290,92)"><g class="pop d07">
    <circle r="8" stroke="#3DDC97" stroke-width="1.5"/>
    <path d="M-3.5 0l2.5 3 5-6" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="3.5" font-size="10" fill="#7FA3BF">créé</text>
  </g></g>
  <g transform="translate(445,92)"><g class="pop d09">
    <circle r="8" stroke="#3DDC97" stroke-width="1.5"/>
    <path d="M-3.5 0l2.5 3 5-6" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="3.5" font-size="10" fill="#7FA3BF">testé</text>
  </g></g>
  <g transform="translate(596,92)"><g class="pop d11">
    <circle r="8" stroke="#3DDC97" stroke-width="1.5"/>
    <path d="M-3.5 0l2.5 3 5-6" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="15" y="3.5" font-size="10" fill="#7FA3BF">livré</text>
  </g></g>

  <g class="fade d13" transform="translate(844,38)" opacity="0.45">
    <g transform="rotate(-12)" stroke="#FF4D3D">
      <circle r="16" stroke-width="1.5"/>
      <path d="M-6 1l4 5 9-10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
