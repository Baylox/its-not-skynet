<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ligne de contribution : décrivez votre besoin, scaffoldez avec scripts/new.sh, testez en conditions réelles, vérifiez avec scripts/doctor.sh, ouvrez une pull request rejouée par la CI. Cycle de statut : draft, beta, stable.">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M10 0V50M20 0V50M30 0V50M40 0V50M0 10H50M0 20H50M0 30H50M0 40H50" stroke="#152E4A" stroke-width="0.5" opacity="0.45"/>
      <path d="M0 0.5H50M0.5 0V50" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="sheet"><rect x="2" y="2" width="896" height="296" rx="9"/></clipPath>
  </defs>
  <style>
    text{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .frame{stroke-dasharray:2260;animation:draw 1.1s .05s cubic-bezier(.6,0,.3,1) both}
    .rail{stroke-dasharray:790;animation:drawR .8s .35s cubic-bezier(.6,0,.3,1) both}
    .st{stroke-dasharray:108;animation:drawS .5s both}
    .fade{animation:fadeUp .5s ease-out both}
    .grow{animation:grow .45s cubic-bezier(.3,1.3,.5,1) both}
    .xr{animation:blink 4s ease-in-out infinite}
    .x2{animation-delay:1s}.x3{animation-delay:2s}.x4{animation-delay:3s}
    .dot{animation:dotmove 4.2s linear infinite}
    .p2{animation-delay:4.4s}.p3{animation-delay:5.8s}
    .pulseS{animation:grow .45s 2.4s cubic-bezier(.3,1.3,.5,1) both,glow 3s 3.2s ease-in-out infinite}
    .s1{animation-delay:.55s}.s2{animation-delay:.77s}.s3{animation-delay:.99s}.s4{animation-delay:1.21s}.s5{animation-delay:1.43s}
    .t0{animation-delay:.15s}.t1{animation-delay:.7s}.t2{animation-delay:.92s}.t3{animation-delay:1.14s}
    .t4{animation-delay:1.36s}.t5{animation-delay:1.58s}.g0{animation-delay:1.75s}.g1{animation-delay:2s}
    .g2{animation-delay:2.2s}.g3{animation-delay:2.4s}.g4{animation-delay:2.15s}.g5{animation-delay:2.35s}
    @keyframes draw{from{stroke-dashoffset:2260}}
    @keyframes drawR{from{stroke-dashoffset:790}}
    @keyframes drawS{from{stroke-dashoffset:108}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
    @keyframes dotmove{from{transform:translateX(80px)}to{transform:translateX(860px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- feuille -->
  <rect x="1" y="1" width="898" height="298" rx="10" fill="#0A1B2E" stroke="#1E3B58"/>
  <rect x="2" y="2" width="896" height="296" rx="9" fill="url(#grid)"/>

  <!-- cadre + coins -->
  <rect class="frame" x="18" y="18" width="864" height="264" stroke="#2E5A80"/>
  <g class="fade t1" stroke="#9BE3FF" stroke-width="2">
    <path d="M18 34V18H34"/><path d="M866 18H882V34"/>
    <path d="M882 266V282H866"/><path d="M34 282H18V266"/>
  </g>

  <!-- croix de repérage -->
  <g stroke="#6FB7DF" stroke-width="1">
    <path class="xr" d="M34 40H46M40 34V46"/>
    <path class="xr x2" d="M854 40H866M860 34V46"/>
    <path class="xr x3" d="M34 258H46M40 252V264"/>
    <path class="xr x4" d="M854 258H866M860 252V264"/>
  </g>

  <!-- titre du plan -->
  <g class="fade t0">
    <rect x="40" y="40" width="26" height="3" fill="#FFB65C"/>
    <text x="40" y="64" font-size="19" font-weight="bold" letter-spacing="1" fill="#DCEBF5">LIGNE DE CONTRIBUTION</text>
    <text x="40" y="82" font-size="11" fill="#7FA3BF">de l'idée à la ressource validée · plan N° 002</text>
  </g>

  <!-- rail -->
  <line class="rail" x1="60" y1="160" x2="840" y2="160" stroke="#3E7EA6" stroke-width="1.2"/>
  <path class="fade t5" d="M848 160l-11-4.5v9z" fill="#3E7EA6"/>

  <!-- impulsions circulantes (sous les stations) -->
  <g clip-path="url(#sheet)">
    <g class="dot" transform="translate(0,160)"><circle cx="-20" r="6" fill="#4FC3F7" opacity="0.18"/><circle cx="-20" r="2.6" fill="#9BE3FF"/></g>
    <g class="dot p2" transform="translate(0,160)"><circle cx="-20" r="6" fill="#4FC3F7" opacity="0.18"/><circle cx="-20" r="2.6" fill="#9BE3FF"/></g>
    <g class="dot p3" transform="translate(0,160)"><circle cx="-20" r="6" fill="#4FC3F7" opacity="0.18"/><circle cx="-20" r="2.6" fill="#9BE3FF"/></g>
  </g>

  <!-- stations -->
  <g>
    <circle class="st s1" cx="90" cy="160" r="17" fill="#0E2438" stroke="#4FC3F7" stroke-width="1.5"/>
    <circle class="st s2" cx="265" cy="160" r="17" fill="#0E2438" stroke="#4FC3F7" stroke-width="1.5"/>
    <circle class="st s3" cx="440" cy="160" r="17" fill="#0E2438" stroke="#4FC3F7" stroke-width="1.5"/>
    <circle class="st s4" cx="615" cy="160" r="17" fill="#0E2438" stroke="#4FC3F7" stroke-width="1.5"/>
    <circle class="st s5" cx="790" cy="160" r="17" fill="#0E2438" stroke="#4FC3F7" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <g class="fade t1">
      <text x="90" y="165" font-size="11.5" font-weight="bold" fill="#9BE3FF">01</text>
      <text x="90" y="124" font-size="13" font-weight="bold" fill="#DCEBF5">DÉCRIRE</text>
      <text x="90" y="196" font-size="10.5" fill="#7FA3BF">décrivez le besoin</text>
    </g>
    <g class="fade t2">
      <text x="265" y="165" font-size="11.5" font-weight="bold" fill="#9BE3FF">02</text>
      <text x="265" y="124" font-size="13" font-weight="bold" fill="#DCEBF5">SCAFFOLD</text>
      <text x="265" y="196" font-size="10.5" fill="#7FA3BF">META.md · draft</text>
      <text x="265" y="212" font-size="10.5" fill="#4FC3F7">scripts/new.sh</text>
    </g>
    <g class="fade t3">
      <text x="440" y="165" font-size="11.5" font-weight="bold" fill="#9BE3FF">03</text>
      <text x="440" y="124" font-size="13" font-weight="bold" fill="#DCEBF5">TESTER</text>
      <text x="440" y="196" font-size="10.5" fill="#7FA3BF">conditions réelles</text>
    </g>
    <g class="fade t4">
      <text x="615" y="165" font-size="11.5" font-weight="bold" fill="#9BE3FF">04</text>
      <text x="615" y="124" font-size="13" font-weight="bold" fill="#DCEBF5">VÉRIFIER</text>
      <text x="615" y="196" font-size="10.5" fill="#7FA3BF">lint · catalogue · audit</text>
      <text x="615" y="212" font-size="10.5" fill="#4FC3F7">scripts/doctor.sh</text>
    </g>
    <g class="fade t5">
      <text x="790" y="165" font-size="11.5" font-weight="bold" fill="#9BE3FF">05</text>
      <text x="790" y="124" font-size="13" font-weight="bold" fill="#DCEBF5">PULL REQUEST</text>
      <text x="790" y="196" font-size="10.5" fill="#7FA3BF">la CI rejoue chaque check</text>
    </g>
  </g>

  <!-- cycle de statut -->
  <g text-anchor="middle">
    <text class="fade g0" x="450" y="236" font-size="9.5" letter-spacing="2.5" fill="#55708A">CYCLE DE STATUT META.MD</text>
    <g class="fade g1">
      <text x="263" y="256" font-size="12" font-weight="bold" fill="#8FA8BC">draft</text>
      <text x="263" y="274" font-size="9.5" fill="#55708A">généré, jamais exécuté</text>
    </g>
    <path class="fade g1" d="M348 252h12m0 0l-5-4m5 4l-5 4" stroke="#55708A" stroke-width="1.2" fill="none"/>
    <g class="fade g4">
      <text x="450" y="256" font-size="12" font-weight="bold" fill="#FFB65C">beta</text>
      <text x="450" y="274" font-size="9.5" fill="#55708A">testé, kilométrage limité</text>
    </g>
    <path class="fade g4" d="M535 252h12m0 0l-5-4m5 4l-5 4" stroke="#55708A" stroke-width="1.2" fill="none"/>
    <g class="fade g5">
      <text x="637" y="256" font-size="12" font-weight="bold" fill="#3DDC97">stable</text>
      <text x="637" y="274" font-size="9.5" fill="#55708A">éprouvé au quotidien</text>
    </g>
  </g>
  <g transform="translate(233,260)"><rect class="grow g2" width="60" height="2" fill="#55708A"/></g>
  <g transform="translate(420,260)"><rect class="grow g3" width="60" height="2" fill="#FFB65C"/></g>
  <g transform="translate(607,260)"><rect class="pulseS" width="60" height="2" fill="#3DDC97"/></g>
</svg>
