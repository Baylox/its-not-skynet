<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="its-not-skynet — validated CLI/AI resources drawn as an engineering blueprint and stamped human-validated. No magic. No uncontrolled network. Just tools that work.">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M10 0V50M20 0V50M30 0V50M40 0V50M0 10H50M0 20H50M0 30H50M0 40H50" stroke="#152E4A" stroke-width="0.5" opacity="0.45"/>
      <path d="M0 0.5H50M0.5 0V50" stroke="#1B3A5C" stroke-width="1" opacity="0.5"/>
    </pattern>
    <clipPath id="sheet"><rect x="2" y="2" width="896" height="276" rx="9"/></clipPath>
    <clipPath id="titleClip"><rect x="44" y="98" width="470" height="62"/></clipPath>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0.35"/>
    </linearGradient>
    <path id="arcT" d="M-39.5 0A39.5 39.5 0 0 1 39.5 0"/>
    <path id="arcB" d="M-39.5 0A39.5 39.5 0 0 0 39.5 0"/>
  </defs>
  <style>
    text{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
    .frame{stroke-dasharray:2220;animation:draw 1.2s .1s cubic-bezier(.6,0,.3,1) both}
    .wipe{transform:translateX(474px);animation:wipe .85s .5s cubic-bezier(.65,0,.35,1) both}
    .title{animation:ink .7s 1.2s ease-out both}
    .fade{animation:fadeUp .55s ease-out both}
    .xr{animation:blink 4s ease-in-out infinite}
    .x2{animation-delay:1s}.x3{animation-delay:2s}.x4{animation-delay:3s}
    .stamp{opacity:.92;animation:stampIn .5s 2.45s cubic-bezier(.3,1.4,.4,1) both}
    .scan{animation:scan 7.5s 3.4s linear infinite}
    .d09{animation-delay:.9s}.d10{animation-delay:1.05s}.d11{animation-delay:1.2s}
    .d12{animation-delay:1.35s}.d13{animation-delay:1.5s}.d14{animation-delay:1.65s}
    .d15{animation-delay:1.8s}.d16{animation-delay:1.6s}.d18{animation-delay:1.85s}
    .d20{animation-delay:2.05s}.d22{animation-delay:2.2s}
    @keyframes draw{from{stroke-dashoffset:2220}}
    @keyframes wipe{from{transform:translateX(0)}}
    @keyframes ink{from{fill-opacity:0}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes stampIn{0%{transform:scale(2.1);opacity:0}70%{transform:scale(.95);opacity:.95}100%{transform:scale(1);opacity:.92}}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(918px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- sheet -->
  <rect x="1" y="1" width="898" height="278" rx="10" fill="#0A1B2E" stroke="#1E3B58"/>
  <rect x="2" y="2" width="896" height="276" rx="9" fill="url(#grid)"/>

  <!-- construction geometry -->
  <g clip-path="url(#sheet)" stroke="#12293F">
    <circle cx="742" cy="128" r="168"/>
    <circle cx="742" cy="128" r="118" stroke-dasharray="3 6"/>
    <line x1="560" y1="272" x2="892" y2="8"/>
  </g>

  <!-- frame + corner ticks -->
  <rect class="frame" x="18" y="18" width="864" height="244" stroke="#2E5A80"/>
  <g class="fade d09" stroke="#9BE3FF" stroke-width="2">
    <path d="M18 34V18H34"/><path d="M866 18H882V34"/>
    <path d="M882 246V262H866"/><path d="M34 262H18V246"/>
  </g>

  <!-- registration crosses -->
  <g stroke="#6FB7DF" stroke-width="1">
    <path class="xr" d="M34 40H46M40 34V46"/>
    <path class="xr x2" d="M854 40H866M860 34V46"/>
    <path class="xr x3" d="M34 240H46M40 234V246"/>
    <path class="xr x4" d="M854 240H866M860 234V246"/>
  </g>

  <!-- title (stroke reveal, then ink fill) -->
  <g clip-path="url(#titleClip)">
    <text class="title" x="48" y="146" font-size="54" font-weight="bold" fill="#E8F4FB" stroke="#4FC3F7" stroke-width="1">its-not-skynet</text>
    <rect class="wipe" x="44" y="98" width="470" height="62" fill="#0A1B2E"/>
  </g>

  <!-- tagline -->
  <text class="fade d16" x="48" y="176" font-size="14" fill="#7FA3BF">No magic. No uncontrolled network. Just tools that work.</text>

  <!-- dimension line -->
  <g class="fade d18">
    <path d="M48 194V208M502 194V208" stroke="#FFB65C" stroke-width="1"/>
    <line x1="58" y1="201" x2="492" y2="201" stroke="#FFB65C" stroke-width="1"/>
    <path d="M48 201L58 197.5V204.5Z" fill="#FFB65C"/>
    <path d="M502 201L492 197.5V204.5Z" fill="#FFB65C"/>
    <text x="275" y="192" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#FFB65C">100% HUMAN-VALIDATED</text>
  </g>
  <text class="fade d20" x="48" y="232" font-size="9.5" letter-spacing="0.5" fill="#3E5D7C">SPEC: created or validated by its author — nothing imported blind.</text>

  <!-- bill of resources -->
  <g class="fade d10">
    <text x="620" y="52" font-size="12" font-weight="bold" letter-spacing="2" fill="#9BE3FF">BILL OF RESOURCES</text>
    <path d="M620 60H878" stroke="#2E5A80"/>
  </g>
  <g font-size="12">
    <g class="fade d11">
      <text x="620" y="84" fill="#FFB65C" font-size="11">01</text><text x="648" y="84" fill="#DCEBF5">hooks</text>
      <text x="878" y="84" text-anchor="end" font-size="10" fill="#55708A">PreToolUse · PostToolUse</text>
    </g>
    <g class="fade d12">
      <text x="620" y="106" fill="#FFB65C" font-size="11">02</text><text x="648" y="106" fill="#DCEBF5">skills</text>
      <text x="878" y="106" text-anchor="end" font-size="10" fill="#55708A">slash commands · agents</text>
    </g>
    <g class="fade d13">
      <text x="620" y="128" fill="#FFB65C" font-size="11">03</text><text x="648" y="128" fill="#DCEBF5">configs</text>
      <text x="878" y="128" text-anchor="end" font-size="10" fill="#55708A">settings · .mcp.json</text>
    </g>
    <g class="fade d14">
      <text x="620" y="150" fill="#FFB65C" font-size="11">04</text><text x="648" y="150" fill="#DCEBF5">subagents</text>
      <text x="878" y="150" text-anchor="end" font-size="10" fill="#55708A">delegated reviewers</text>
    </g>
    <g class="fade d15">
      <text x="620" y="172" fill="#FFB65C" font-size="11">05</text><text x="648" y="172" fill="#DCEBF5">architecture</text>
      <text x="878" y="172" text-anchor="end" font-size="10" fill="#55708A">decisions · schemas</text>
    </g>
  </g>

  <!-- title block (cartouche) -->
  <g class="fade d20">
    <rect x="618" y="196" width="264" height="64" fill="#0E2438" stroke="#2E5A80"/>
    <path d="M618 228H882M760 196V260" stroke="#2E5A80"/>
    <text x="626" y="209" font-size="8" letter-spacing="1.5" fill="#55708A">PROJECT</text>
    <text x="626" y="222" font-size="11" fill="#DCEBF5">its-not-skynet</text>
    <text x="768" y="209" font-size="8" letter-spacing="1.5" fill="#55708A">SCALE</text>
    <text x="768" y="222" font-size="11" fill="#DCEBF5">1:1</text>
    <text x="626" y="241" font-size="8" letter-spacing="1.5" fill="#55708A">APPROVED BY</text>
    <text x="626" y="254" font-size="11" fill="#DCEBF5">HUMAN</text>
    <path d="M672 248l4 5 8-10" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="768" y="241" font-size="8" letter-spacing="1.5" fill="#55708A">REV</text>
    <text x="768" y="254" font-size="11" fill="#3DDC97">stable</text>
  </g>

  <!-- stamp -->
  <g transform="translate(548,204)">
    <g class="stamp">
      <g transform="rotate(-14)" stroke="#FF4D3D">
        <circle r="45" stroke-width="2.5"/>
        <circle r="34.5" stroke-width="1.2"/>
        <path d="M-42.5 0l3-3 3 3-3 3zM36.5 0l3-3 3 3-3 3z" fill="#FF4D3D" stroke="none"/>
        <path d="M-13 2l8 9 18-20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text font-size="10" font-weight="bold" letter-spacing="1.6" fill="#FF4D3D" stroke="none">
          <textPath href="#arcT" startOffset="50%" text-anchor="middle">HUMAN-VALIDATED</textPath>
        </text>
        <text font-size="10" font-weight="bold" letter-spacing="1.6" fill="#FF4D3D" stroke="none">
          <textPath href="#arcB" startOffset="50%" text-anchor="middle">REAL CONDITIONS</textPath>
        </text>
      </g>
    </g>
  </g>

  <!-- scan sweep -->
  <g clip-path="url(#sheet)">
    <g class="scan">
      <rect x="-16" y="16" width="14" height="248" fill="url(#trail)"/>
      <rect x="-2" y="16" width="2.2" height="248" fill="#7FDBFF" opacity="0.6"/>
    </g>
  </g>
</svg>
